<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ferrailleurs — Vocabulaire et aperçu des cartes</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Barlow+Condensed:wght@800;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    :root {
      --tone-energie: #f4a261; --tone-fer: #457b9d; --tone-humain: #40916c;
      --tone-usine: #e07a5f; --tone-science: #9d4edd;
    }
    body { background: #16181d; color: #f0f0f0; padding: 24px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid #333;
    }
    h1 { font-size: 1.3rem; letter-spacing: 0.06em; text-transform: uppercase; font-family: 'Orbitron', 'Barlow Condensed', sans-serif; }
    .controls { display: flex; gap: 10px; align-items: center; font-size: 0.85rem; color: #bbb; }
    button {
      background: #ffd166; color: #111; border: 2px solid #111; padding: 6px 12px;
      font-weight: 800; border-radius: 4px; cursor: pointer; box-shadow: 2px 2px 0 #000;
    }
    button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }

    .section-title { font-size: 0.9rem; text-transform: uppercase; color: #888; margin: 20px 0 12px; }
    .term-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .term-group { background: #22252d; border: 2px solid #333; border-radius: 8px; padding: 12px; }
    .term-group h3 { color: #ffd166; font-size: 0.8rem; margin-bottom: 10px; text-transform: uppercase; }
    .term-item { display: flex; align-items: center; gap: 10px; min-height: 42px; font-size: 0.78rem; color: #ddd; }
    .term-icon { width: 34px; height: 34px; object-fit: contain; flex: 0 0 34px; }
    .term-icon.prod, .term-icon.main { width: 56px; flex-basis: 56px; }
    .keyword { display: inline-flex; align-items: center; gap: 3px; font-weight: 900; white-space: nowrap; }
    .resource-word { display: inline-flex; align-items: center; justify-content: center; background: #ffd166; border: 1px solid #111; border-radius: 4px; color: #111; font-size: 0.52rem; font-weight: 900; line-height: 1.05; text-align: center; padding: 2px; width: 40px; height: 40px; }
    .resource-word.inline-icon { width: auto; height: auto; padding: 1px 3px; font-size: 0.55em; }
    .resource-word.term-icon { width: 34px; height: 34px; flex: 0 0 34px; }

    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 32px; justify-items: center; padding: 10px 0 40px;
    }
    body.single-export { width: 240px; height: 340px; padding: 0; overflow: hidden; background: transparent; }
    body.single-export > :not(#cards-list) { display: none !important; }
    body.single-export #cards-list { display: block; width: 240px; height: 340px; margin: 0; padding: 0; }
    body.single-export .card-wrapper { display: none; }
    body.single-export .card-wrapper.export-target { display: flex; width: 240px; height: 340px; gap: 0; }
    body.single-export .card-actions-bar { display: none; }
    body.single-export .card { width: 240px; height: 340px; box-shadow: none; transform: none; }

    /* --- TEMPLATE CARTE (Largeur 240px, Hauteur 340px) --- */
    .card-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .card {
      width: 240px; height: 340px; border-radius: 12px 16px 11px 15px;
      border: 4px solid #211d19; box-shadow: 6px 6px 0 #211d19;
      display: flex; flex-direction: column;
      padding: 12px; position: relative; cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      user-select: none; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background-image: radial-gradient(circle, rgba(32, 25, 20, 0.22) 0.8px, transparent 1px);
      background-size: 6px 6px; opacity: 0.2; mix-blend-mode: multiply;
    }

    .card.rot-0 { transform: rotate(0deg); }
    .card.rot-45 { transform: rotate(45deg) scale(0.92); }
    .card.rot-90 { transform: rotate(90deg) scale(0.92); filter: brightness(0.75); }

    .bg-energie { --card-ink: #654a2c; --card-shadow: #49351f; --card-panel: #efe6d4; --card-trim: #ffd34e; --box-face-hi: #78613d; --box-face-low: #5e4a2f; --box-edge: #98783e; background: linear-gradient(160deg, #ffdf6b 0%, var(--tone-energie) 100%); color: #111; }
    .bg-ressource { --card-ink: #29465a; --card-shadow: #1d3545; --card-panel: #dce7eb; --card-trim: #81d3df; --box-face-hi: #5a7b86; --box-face-low: #43636d; --box-edge: #2f5562; background: linear-gradient(160deg, #a8dadc 0%, var(--tone-fer) 100%); color: #111; }
    .bg-humain { --card-ink: #285444; --card-shadow: #1d4034; --card-panel: #dcebe2; --card-trim: #83e2b2; --box-face-hi: #597966; --box-face-low: #405c4c; --box-edge: #2d513f; background: linear-gradient(160deg, #95d5b2 0%, var(--tone-humain) 100%); color: #111; }
    .bg-construction { --card-ink: #694038; --card-shadow: #4d302a; --card-panel: #f1ddd8; --card-trim: #ffad94; --box-face-hi: #876054; --box-face-low: #66483f; --box-edge: #55352d; background: linear-gradient(160deg, #f8ad9d 0%, var(--tone-usine) 100%); color: #111; }
    .bg-science { --card-ink: #4c3760; --card-shadow: #382748; --card-panel: #e9dff0; --card-trim: #d59aff; --box-face-hi: #715f81; --box-face-low: #564766; --box-edge: #44334f; background: linear-gradient(160deg, #e0aaff 0%, var(--tone-science) 100%); color: #111; }

    .card-top {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0;
      justify-content: stretch; align-items: start; z-index: 3;
      margin-top: -3px; margin-bottom: 0;
    }
    .top-left-group {
      display: flex; align-items: center; gap: 6px;
    }
    .card-top .top-left-group { display: contents; }
    .card-top .value-box { grid-column: 1; justify-self: center; }
    .card-top .badges-left { grid-column: 2; justify-content: center; }
    .card-top .badges-right { grid-column: 3; justify-content: center; }
    .value-box {
      background: transparent; border: 0; border-radius: 0;
      width: 52px; height: 58px; flex: 0 0 52px;
      display: flex; align-items: flex-start; justify-content: center;
      overflow: visible; transform: rotate(-3deg); z-index: 2;
    }
    .card-number { display: block; width: 74px; height: 74px; max-width: none; object-fit: contain;
      transform: translateY(-4px);}

    .badges-left, .badges-right {
      display: flex; gap: 4px; align-items: center;
    }
    .badge-icon {
      width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
    }
    .card-top .badge-icon { width: 50px; height: 50px; }
    .card-top .badge-icon.badge-round { width: 54px; height: 54px; }
    .badge-icon img { width: 100%; height: 100%; object-fit: contain; }

    .inline-icon, .effect-icon { width: 32px; height: 32px; display: inline-block; object-fit: contain; vertical-align: middle; margin: 0 2px; border: 0; outline: 0; box-shadow: none; }
    .inline-icon.icon-energie, .inline-icon.icon-fer { width: 34px; height: 34px; }
    .inline-icon.icon-tokenhumain, .inline-icon.icon-tokenplaque, .inline-icon.icon-tokenarme { width: 40px; height: 40px; }
    .effect-icon.prod, .effect-icon.main { width: 44px; height: 29px; }
    .effect-icon.tap, .effect-icon.untap { width: 22px; height: 22px; }
    .effect-icon.swap { width: 24px; height: 24px; }
    .logic-word { display: inline-block; font-weight: 700; font-size: 0.65rem; margin: 0 2px; color: #111; line-height: 1.15; vertical-align: baseline; }
    .effect-colon { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 12px; height: 24px; margin: 0 3px; vertical-align: middle; }
    .effect-colon::before, .effect-colon::after { content: ""; display: block; width: 6px; height: 6px; background: #211d19; }
    .choice-slash { display: inline-block; position: relative; width: 8px; height: 18px; vertical-align: middle; margin: 0 1px; }
    .choice-slash::before { content: ""; position: absolute; left: 3px; top: 2px; width: 2px; height: 14px; border-radius: 1px; background: #211d19; transform: rotate(28deg); }
    .choice-divider { display: flex; align-items: center; justify-content: center; gap: 0; width: 100%; height: 12px; margin: 4px 0; }
    .choice-divider::before, .choice-divider::after { content: ""; flex: 1; height: 2px; background: #211d19; border-radius: 1px; }
    .choice-divider .choice-slash { width: 8px; margin: 0; }
    .operator-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; color: #bbb; font-size: 0.8rem; margin: -14px 0 22px; }
    .operator-legend .choice-divider { width: 54px; flex: 0 0 54px; margin: 0 3px; }

    .family-banner {
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      font-weight: 900; font-size: 1rem; text-transform: uppercase;
      background: var(--card-ink); color: #ffd21f; padding: 1px 8px; border-radius: 1px;
      letter-spacing: 0.06em; border: 3px solid #211d19;
      box-shadow: 3px 3px 0 #211d19;
      text-align: center; margin-top: -3px; ; margin-bottom: 6px; position: relative; z-index: 2;
    }
    .card-text-container {
      display: flex; flex-direction: column; gap: 5px; z-index: 2; flex: 1; min-height: 0;
    }
    .card-box {
      position: relative; isolation: isolate; background: transparent;
      color: #fff7e8; border: 0; border-radius: 0;
      padding: 7px 8px; font-size: 0.84rem; font-weight: 500; line-height: 1.3;
      box-shadow: none;
      flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center;
    }
    .card-box::before, .card-box::after { content: ""; position: absolute; pointer-events: none; }
    .card-box::before {
      inset: 0; z-index: -2; background: #211d19;
      clip-path: polygon(0 8px, 8px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 2px 100%, 0 calc(100% - 2px));
      filter: drop-shadow(3px 3px 0 var(--box-edge)) drop-shadow(1px 1px 0 #211d19);
    }
    .card-box::after {
      inset: 3px; z-index: -1;
      background: linear-gradient(145deg, var(--box-face-hi) 0%, var(--box-face-low) 78%);
      clip-path: polygon(0 6px, 6px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 2px 100%, 0 calc(100% - 2px));
    }
    .card-box > div { position: relative; z-index: 1; }
    .sup-icon { position: absolute; top: -8px; right: 8px; z-index: 3; width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(1px 2px 0 #211d19); }
    .card-box .choice-divider::before, .card-box .choice-divider::after,
    .card-box .choice-slash::before,
    .card-box .effect-colon::before, .card-box .effect-colon::after { background: #e6d8bb; }

    .btn-mini { padding: 3px 8px; font-size: 0.72rem; background: #2b2f3a; color: #fff; border-color: #444; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Ferrailleurs — Vocabulaire des cartes</h1>
      <small style="color:#999">Clique sur une carte pour tester l'engagement (0° → 45° → 90°)</small>
    </div>
    <div class="controls">
      <button onclick="resetAllRotations()">Tout réinitialiser</button>
    </div>
  </header>

  <div class="section-title">1. Références communes</div>
  <div class="term-groups" id="terms-list"></div>
  <div class="operator-legend"><span class="choice-divider" aria-hidden="true"><span class="choice-slash"></span></span><span>autre option</span><span class="logic-word">et</span><span>cumuler les coûts</span></div>

  <div class="section-title">2. Aperçu des 30 cartes (5 familles × valeurs 1 à 6)</div>
  <div class="cards-grid" id="cards-list"></div>

  <script src="../src/data/cards.js"></script>
  <script>
    const ICONS = {
      energie: { src: "../assets/resources/badge_power.png", label: "ÉNERGIE", group: "Ressources" },
      fer: { src: "../assets/resources/badge_ressource.png", label: "FER", group: "Ressources" },
      humain: { src: "../assets/badges/badge_human.png", label: "HUMAIN", group: "Badges" },
      usine: { src: "../assets/badges/badge_factory.png", label: "USINE", group: "Badges" },
      science: { src: "../assets/badges/badge_science.png", label: "SCIENCE", group: "Badges" },
      tokenHumain: { src: "../assets/token/token_human.png", label: "JETON HUMAIN", group: "Pièces" },
      tokenPlaque: { src: "../assets/token/token_grid.png", label: "JETON PLAQUE", group: "Pièces" },
      tokenArme: { src: "../assets/token/token_gun.png", label: "JETON ARME", group: "Pièces" },
      prod: { src: "../assets/divers/div_prod.png", label: "PROD", group: "Actions" },
      tap: { src: "../assets/divers/div_tap.png", label: "TAP", group: "Actions" },
      untap: { src: "../assets/divers/div_untap.png", label: "UNTAP", group: "Actions" },
      main: { src: "../assets/divers/div_main.png", label: "MAIN", group: "Actions" },
      swap: { src: "../assets/divers/div_swap.png", label: "ÉCHANGE", group: "Actions" }
    };

    const icon = (key, className = "inline-icon") =>
      `<img src="${ICONS[key].src}" alt="${ICONS[key].label}" class="${className} icon-${key.toLowerCase()}">`;

    const keyword = (key) => icon(key, `effect-icon ${key}`);
    const connector = (word) => `<span class="logic-word">${word.toLowerCase()}</span>`;
    const effectColon = () => `<span class="effect-colon" role="img" aria-label="produit"></span>`;
    const choiceSlash = () => `<span class="choice-slash" role="img" aria-label="choix"></span>`;
    const choiceDivider = () => `<div class="choice-divider" role="img" aria-label="autre option"><span class="choice-slash"></span></div>`;

    const ICON_GROUPS = [
      { title: "Ressources", keys: ["energie", "fer"], descriptions: ["Ressource Énergie", "Ressource Fer"] },
      { title: "Badges", keys: ["humain", "usine", "science"], descriptions: ["Badge Humain", "Badge Usine", "Badge Science"] },
      { title: "Pièces", keys: ["tokenHumain", "tokenPlaque", "tokenArme"], descriptions: ["Jeton Humain", "Jeton Plaque", "Jeton Arme"] },
      { title: "Actions", keys: ["prod", "tap", "untap", "main", "swap"], descriptions: ["Zone de production", "Incliner une carte", "Redresser une carte", "Prendre l'initiative", "Échanger une carte"] }
    ];

    document.getElementById("terms-list").innerHTML = ICON_GROUPS.map(group => `
      <section class="term-group">
        <h3>${group.title}</h3>
        ${group.keys.map((key, i) => `
          <div class="term-item">${icon(key, `term-icon ${key}`)}<span><strong>${ICONS[key].label}</strong> — ${group.descriptions[i]}</span></div>
        `).join("")}
      </section>
    `).join("");

    const renderPreviewTokens = tokens => tokens.map(token => {
      if (token.icon) return ICONS[token.icon].group === "Actions" ? keyword(token.icon) : icon(token.icon);
      if (token.choice) return choiceSlash();
      if (token.colon) return effectColon();
      if (token.divider) return choiceDivider();
      if (token.br) return "<br>";
      return token.text || "";
    }).join(" ");
    const CARDS_SAMPLE = Object.keys(CARD_TYPES).flatMap(type =>
      Array.from({ length: 6 }, (_, index) => {
        const card = createCard(type, index + 1);
        const family = CARD_TYPES[type];
        return {
          ...card, familyName: family.familyName,
          leftBadges: card.leftBadges, rightBadges: card.rightBadges,
          box1: renderPreviewTokens(card.previewTokens), box2: renderPreviewTokens(card.secretPreviewTokens) || "N/A",
        };
      })
    );

    const cardsEl = document.getElementById("cards-list");
    CARDS_SAMPLE.forEach((c, idx) => {
      const badgeClass = t => ["humain", "usine", "science"].includes(t) ? "badge-round" : "badge-square";
      const leftHTML = c.leftBadges.map(t => `<div class="badge-icon ${badgeClass(t)}">${icon(t, "")}</div>`).join("");
      const rightHTML = c.rightBadges.map(t => `<div class="badge-icon ${badgeClass(t)}">${icon(t, "")}</div>`).join("");

      cardsEl.innerHTML += `
        <div class="card-wrapper">
          <div class="card bg-${c.type} rot-0" id="card-${idx}" data-export-key="${c.type}_${c.value}" data-rot="0" onclick="cycleRotation(${idx})">
            
            <div class="card-top">
              <div class="top-left-group">
                <div class="value-box"><img class="card-number" src="../assets/numbers/num_${c.value}.png" alt="Valeur ${c.value}"></div>
                <div class="badges-left">${leftHTML}</div>
              </div>
              <div class="badges-right">${rightHTML}</div>
            </div>

            <div class="family-banner">${c.familyName}</div>

            <div class="card-text-container">
              <div class="card-box"><div>${c.box1}</div></div>
              <div class="card-box lower-box"><img class="sup-icon" src="../assets/divers/div_sup.png" alt=""><div>${c.box2}</div></div>
            </div>

          </div>
          <div class="card-actions-bar">
            <button class="btn-mini" onclick="exportCardPNG('card-${idx}', '${c.type}_${c.value}')">Exporter PNG</button>
          </div>
        </div>`;
    });

    const exportKey = new URLSearchParams(location.search).get("card");
    if (exportKey) {
      document.body.classList.add("single-export");
      document.querySelectorAll(".card-wrapper").forEach(wrapper => {
        wrapper.classList.toggle("export-target", wrapper.querySelector(".card")?.dataset.exportKey === exportKey);
      });
    }

    function cycleRotation(idx) {
      const el = document.getElementById(`card-${idx}`);
      const cur = parseInt(el.dataset.rot, 10);
      const next = cur === 0 ? 45 : (cur === 45 ? 90 : 0);
      el.classList.remove(`rot-${cur}`);
      el.classList.add(`rot-${next}`);
      el.dataset.rot = next;
    }

    function resetAllRotations() {
      document.querySelectorAll(".card").forEach(el => {
        el.classList.remove("rot-45", "rot-90");
        el.classList.add("rot-0");
        el.dataset.rot = 0;
      });
    }

    function exportCardPNG(elementId, filename) {
      const node = document.getElementById(elementId);
      const clone = node.cloneNode(true);
      clone.classList.remove("rot-45", "rot-90");
      clone.classList.add("rot-0");
      clone.style.margin = "0";
      clone.style.boxShadow = "none";

      const styles = document.querySelector("style").innerHTML;
      const svgData = `
        <svg xmlns="http://www.w3.org/2000/svg" width="240" height="340">
          <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <style>${styles}</style>
              ${clone.outerHTML}
            </div>
          </foreignObject>
        </svg>`;

      const img = new Image();
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = 480; 
        canvas.height = 680;
        const ctx = canvas.getContext("2d");
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        const a = document.createElement("a");
        a.download = `${filename}.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
      };
      img.src = url;
    }
  </script>
</body>
</html>
